name: Check MANIFEST
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify reproducible synthetic fixture
        run: npm run data:demo && git diff --exit-code -- public/data/demo-study.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-site
          path: dist
          if-no-files-found: error
