name: Check MANIFEST
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: E2E tests
        id: e2e
        env:
          E2E_SUITE: MANIFEST
        run: npm run test:e2e
      - name: Upload E2E report, screenshots and traces
        id: e2e-report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Link E2E report in run summary
        if: ${{ !cancelled() && steps.e2e-report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.e2e-report.outputs.artifact-url }}
        run: |
          printf '\n[Download E2E reports, screenshots and traces](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify reproducible synthetic fixture
        run: npm run data:demo && git diff --exit-code -- public/data/demo-study.json public/data/demo docs/DATA-SOURCES.json
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-site
          path: dist
          if-no-files-found: error
